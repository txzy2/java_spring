services:
  spring_db:
    image: ${PGSQL_VERSION}
    restart: always
    container_name: spring_db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - spring_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  spring_adminer:
    image: ${ADMINER_VERSION}
    container_name: spring_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - spring_net

  spring_redis:
    image: redis:latest
    container_name: spring_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    networks:
      - spring_net

  spring_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_app
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      spring_db:
        condition: service_healthy
    networks:
      - spring_net

networks:
  spring_net:
    external: true