services:
  spring_db:
    image: ${PGSQL_VERSION}
    restart: always
    container_name: spring_db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - spring_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  spring_adminer:
    image: ${ADMINER_VERSION}
    container_name: spring_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - spring_net

  spring_redis:
    image: redis:latest
    container_name: spring_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - spring_net

  spring_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring_app
    restart: always
    ports:
      - "${APP_PORT}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://spring_db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
      - SPRING_REDIS_HOST=spring_redis
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - ./logs:/app/logs
    depends_on:
      spring_db:
        condition: service_healthy
    networks:
      - spring_net

networks:
  spring_net:
    external: true