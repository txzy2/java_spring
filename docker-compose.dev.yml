services:
  spring_db:
    image: ${PGSQL_VERSION}
    restart: always
    container_name: spring_db
    tty: true
    volumes:
      - ./dbdata:/var/lib/postgresql/data
    ports:
      - ${DB_PORT}:5432
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - spring_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  h_main_adminer:
    image: ${ADMINER_VERSION}
    container_name: spring_adminer
    restart: always
    ports:
      - ${ADMINER_PORT}:8080
    networks:
      - spring_net

networks:
  spring_net:
    external: true