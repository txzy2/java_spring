# === DEVMETOOLS CONFIGURATION ===
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,public/**
spring.devtools.livereload.enabled=true
spring.devtools.livereload.port=35729
# === STATIC RESOURCES CONFIGURATION (Spring Boot 4.x) ===
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=0
spring.web.resources.cache.use-last-modified=false
# === CACHE CONTROL HEADERS (Spring Boot 4.x) ===
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true
# === THYMELEAF ===
spring.thymeleaf.cache=false
# === LOGGING ===
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.boot.devtools=DEBUG
# === JPA ===
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.url=jdbc:postgresql://localhost:862/spring_db
spring.datasource.username=spring_user
spring.datasource.password=spring_pass
# === REDIS ===
spring.data.redis.host=localhost
spring.data.redis.password=123
spring.data.redis.port=866
